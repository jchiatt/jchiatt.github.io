<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0d">
<title>Mitsurugi WCQ Field Manual — Andrew Hadfield</title>
<style>
html,body{margin:0;min-height:100%;background:#080a0d;color:#f1e8d4;font-family:Inter,system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.crest{width:64px;height:64px;margin:auto;border:1px solid #d5b46e;border-radius:50%;display:grid;place-items:center;color:#d5b46e;font:700 2rem Georgia,serif;animation:pulse 1.4s ease-in-out infinite}.loading p{color:#a9a08f}.loading a{color:#d5b46e}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 32px rgba(213,180,110,.2)}}
</style>
</head>
<body>
<div class="loading"><div><div class="crest">御</div><h1>Mitsurugi Field Manual</h1><p>Loading the full visual edition…</p><p id="fallback" hidden>Unable to load the guide. <a href="https://raw.githubusercontent.com/jchiatt/jchiatt.github.io/6a19362c119b28336211e3504045617db0a5bcc0/yugioh/mitsurugi/index.html">Open the archived edition</a>.</p></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/jchiatt/jchiatt.github.io/6a19362c119b28336211e3504045617db0a5bcc0/yugioh/mitsurugi/index.html';
  try{
    const response=await fetch(source,{cache:'force-cache'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const one=doc.querySelector('.card.one img');
    const two=doc.querySelector('.card.two img');
    const three=doc.querySelector('.card.three img');
    if(!one||!two||!three) throw new Error('Missing hero artwork');

    // Archived order: Murakumo / Fallen / Fydraulis.
    // Original order: Fallen / Fydraulis / Murakumo.
    const original={
      one:{src:one.src,alt:one.alt},
      two:{src:two.src,alt:two.alt},
      three:{src:three.src,alt:three.alt}
    };
    one.src=original.two.src;
    one.alt=original.two.alt;
    two.src=original.three.src;
    two.alt=original.three.alt;
    three.src=original.one.src;
    three.alt=original.one.alt;

    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(error){
    console.error(error);
    document.querySelector('.loading p:not(#fallback)')?.remove();
    document.getElementById('fallback').hidden=false;
  }
})();
</script>
</body>
</html>
